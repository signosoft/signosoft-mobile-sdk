name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Swift core and Dart plugin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The Flutter plugin reaches the Swift core through a symlink pointing at
      # the sibling ios/ directory. A checkout that dereferenced it would still
      # compile here and then fail for every consumer, so assert it first.
      - name: The Swift core is reachable through the symlink
        run: |
          link=signosoft_signer/ios/signosoft_signer/SignosoftSignerCore
          test -L "$link" || { echo "::error::$link is not a symlink"; exit 1; }
          test -f "$link/Package.swift" || { echo "::error::$link is dangling"; exit 1; }

      - name: Swift core tests
        working-directory: ios
        run: swift test

      # `swift test` above runs on macOS, where every `#if canImport(UIKit)`
      # source is compiled out — the view controller, the bridge dispatch, the
      # timeout watchdog and the HTTP-error path are all invisible to it. A
      # simulator destination is the only one that both compiles and runs them.
      #
      # Two to three minutes of a macos runner, billed at 10x on a private repo.
      # Kept on every push anyway, unlike example-build below: it is the only
      # job that executes the WebView layer at all, and work lands on dev by
      # direct push, so an `event_name != 'push'` gate would mean it almost
      # never ran.
      - name: View controller tests on an iOS Simulator
        working-directory: ios
        run: |
          # Whichever iPhone this runner image ships — a hard-coded device name
          # breaks the day GitHub rolls the image's Xcode forward.
          udid=$(xcrun simctl list devices available \
            | awk '/^-- iOS/ { ios = 1; next } /^-- / { ios = 0 } ios && /iPhone/ { print; exit }' \
            | grep -oE '[0-9A-F-]{36}' || true)
          test -n "$udid" || { echo "::error::no iOS Simulator runtime on this runner"; exit 1; }
          xcrun simctl list devices available | grep "$udid"
          xcodebuild test \
            -scheme SignosoftSigner \
            -destination "platform=iOS Simulator,id=$udid"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Plugin analyze, format and tests
        working-directory: signosoft_signer
        run: |
          flutter pub get
          flutter analyze
          dart format --output=none --set-exit-if-changed .
          flutter test

  # Linux bills at 1x, so unlike the iOS example build this runs on every push.
  android:
    name: Kotlin core and Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Flutter plugin compiles the Kotlin core out of the sibling android/
      # directory. Nothing here fails loudly if that path moves — the plugin
      # would just quietly compile without the core — so assert it first.
      - name: The Kotlin core is where the plugin expects it
        run: |
          core=android/signosoft-signer/src/main
          grep -q "\.\./\.\./$core" signosoft_signer/android/build.gradle.kts ||
            { echo "::error::the plugin no longer points at $core"; exit 1; }
          test -f "$core/AndroidManifest.xml" ||
            { echo "::error::$core is missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kotlin core tests
        working-directory: android
        run: ./gradlew test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # The only check that exercises the plugin, the shared source directory
      # and the merged manifest together the way a customer's build does.
      - name: Example app builds for Android
        working-directory: examples/medicly
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Plugin Android unit tests
        working-directory: examples/medicly/android
        run: ./gradlew :signosoft_signer:testDebugUnitTest

  # The iOS equivalent of the Android example build above, and the expensive
  # one: macos runners bill private-repo minutes at 10x. Kept off plain pushes,
  # so it runs where review happens.
  example-build:
    name: iOS example build
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Example app builds for the simulator
        working-directory: examples/medicly
        run: |
          flutter pub get
          flutter build ios --simulator --debug
